[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "uzbekistan-os-api"
version = "0.1.0"
description = "Public and internal API for the Uzbekistan OS MVP"
requires-python = ">=3.12,<3.13"
dependencies = [
  "alembic==1.18.5",
  "boto3==1.43.62",
  "fastapi==0.141.1",
  "pgvector==0.5.0",
  "psycopg[binary]==3.3.4",
  "pydantic-settings==2.14.2",
  "pypdf==6.14.2",
  "redis==8.1.0",
  "sqlalchemy==2.0.51",
  "uvicorn[standard]==0.52.0",
]

[project.optional-dependencies]
dev = [
  "httpx2==2.9.1",
  "jsonschema==4.26.0",
  "pip-audit==2.10.1",
  "pytest==9.1.1",
  "pyyaml==6.0.3",
  "ruff==0.16.1",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
