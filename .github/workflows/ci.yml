name: CI

on:
  pull_request:
  push:
    branches: [main, staging]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm audit --audit-level=high

  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip==26.2
      - run: python -m pip install -e '.[dev]'
      - run: python -m ruff format --check . ../../scripts/validate_contracts.py
      - run: python -m ruff check . ../../scripts/validate_contracts.py
      - run: python -m pytest
      - run: python -m alembic -c alembic.ini upgrade head --sql > /tmp/uzbekistan-os-migration.sql
      - run: python ../../scripts/validate_contracts.py
      - run: python -m pip_audit --skip-editable

  infrastructure:
    runs-on: ubuntu-latest
    env:
      API_IMAGE: ghcr.io/example/uzbekistan-os-api:test
      API_CORS_ORIGINS: https://staging.example.invalid
      DATABASE_URL: postgresql+psycopg://uzbekistan_os:validation-only@postgres:5432/uzbekistan_os
      IMAGE_TAG: test
      WEB_IMAGE: ghcr.io/example/uzbekistan-os-web:test
      WORKER_IMAGE: ghcr.io/example/uzbekistan-os-worker:test
      POSTGRES_PASSWORD: validation-only
      S3_ACCESS_KEY: validation-only
      S3_SECRET_KEY: validation-only-secret
    steps:
      - uses: actions/checkout@v4
      - run: docker compose -f docker-compose.yml config --quiet
      - run: docker compose -f infra/staging/docker-compose.yml config --quiet
      - run: bash -n scripts/deploy_staging.sh scripts/smoke_staging.sh

  deploy-staging:
    needs: [web, api, infrastructure]
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/staging' &&
      vars.STAGING_ENABLED == 'true'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/staging.yml
    with:
      image_tag: ${{ github.sha }}
