openapi: 3.1.0
info:
  title: Uzbekistan OS API
  version: 0.1.0
  description: >-
    Contract skeleton for the Uzbekistan OS public API. Paths marked with
    x-implementation-status: planned are not implemented yet.
servers:
  - url: http://localhost:8000/api/v1
    description: Local development
security: []
tags:
  - name: system
  - name: authentication
  - name: profiles
  - name: conversations
  - name: knowledge
  - name: workflows
  - name: feedback
  - name: ingestion
  - name: administration
paths:
  /health:
    get:
      tags: [system]
      operationId: getHealth
      summary: Get API health
      x-authorization:
        mode: public
      responses:
        "200":
          description: Service is healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /ready:
    get:
      tags: [system]
      operationId: getReadiness
      summary: Check service dependencies
      x-authorization:
        mode: public
      responses:
        "200":
          description: Required service dependencies are available
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadinessResponse"
        "503":
          $ref: "#/components/responses/ErrorResponse"
  /conversations:
    get:
      tags: [conversations]
      operationId: listConversations
      summary: List conversations for the current principal or guest session
      x-implementation-status: planned
      x-authorization:
        mode: optional-principal
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Conversation page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConversationListResponse"
        default:
          $ref: "#/components/responses/ErrorResponse"
    post:
      tags: [conversations]
      operationId: createConversation
      summary: Create a conversation
      x-implementation-status: planned
      x-authorization:
        mode: optional-principal
      x-idempotency:
        mode: caller-key
        replay: original-response
        conflict: different-request
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateConversationRequest"
      responses:
        "201":
          description: Conversation created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConversationResponse"
        default:
          $ref: "#/components/responses/ErrorResponse"
  /conversations/{conversationId}:
    get:
      tags: [conversations]
      operationId: getConversation
      summary: Get a conversation
      x-implementation-status: planned
      x-authorization:
        mode: optional-principal
      parameters:
        - $ref: "#/components/parameters/ConversationId"
      responses:
        "200":
          description: Conversation detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConversationResponse"
        default:
          $ref: "#/components/responses/ErrorResponse"
    delete:
      tags: [conversations]
      operationId: deleteConversation
      summary: Soft-delete a conversation
      x-implementation-status: planned
      x-authorization:
        mode: optional-principal
      x-idempotency:
        mode: deterministic-replay
        replay: already-deleted
      parameters:
        - $ref: "#/components/parameters/ConversationId"
      responses:
        "204":
          description: Conversation deleted or already deleted
        default:
          $ref: "#/components/responses/ErrorResponse"
  /conversations/{conversationId}/messages:
    get:
      tags: [conversations]
      operationId: listConversationMessages
      summary: List persisted messages in a conversation
      x-implementation-status: planned
      x-authorization:
        mode: optional-principal
      parameters:
        - $ref: "#/components/parameters/ConversationId"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Conversation message page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageListResponse"
        default:
          $ref: "#/components/responses/ErrorResponse"
    post:
      tags: [conversations]
      operationId: sendMessage
      summary: Send a message and stream the assistant response
      description: >-
        Emits application-owned SSE events: start, chunk, citation, workflow,
        done, and error. Provider-specific stream events are never exposed.
      x-implementation-status: planned
      x-authorization:
        mode: optional-principal
      x-idempotency:
        mode: caller-key
        replay: original-stream-outcome
        conflict: different-request
      x-sse-events:
        - $ref: "#/components/schemas/StreamStartEvent"
        - $ref: "#/components/schemas/StreamChunkEvent"
        - $ref: "#/components/schemas/StreamCitationEvent"
        - $ref: "#/components/schemas/StreamWorkflowEvent"
        - $ref: "#/components/schemas/StreamDoneEvent"
        - $ref: "#/components/schemas/StreamErrorEvent"
      parameters:
        - $ref: "#/components/parameters/ConversationId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SendMessageRequest"
      responses:
        "200":
          description: SSE response stream
          content:
            text/event-stream:
              schema:
                type: string
        default:
          $ref: "#/components/responses/ErrorResponse"
  /knowledge/{documentId}:
    get:
      tags: [knowledge]
      operationId: getKnowledgeDocument
      summary: Get an eligible published knowledge document
      x-implementation-status: planned
      x-authorization:
        mode: public
      parameters:
        - $ref: "#/components/parameters/DocumentId"
      responses:
        "200":
          description: Published knowledge document
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KnowledgeDocumentResponse"
        default:
          $ref: "#/components/responses/ErrorResponse"
  /knowledge/{documentId}/sources:
    get:
      tags: [knowledge]
      operationId: listKnowledgeDocumentSources
      summary: List official evidence for a published knowledge document
      x-implementation-status: planned
      x-authorization:
        mode: public
      parameters:
        - $ref: "#/components/parameters/DocumentId"
      responses:
        "200":
          description: Document source evidence
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KnowledgeSourceListResponse"
        default:
          $ref: "#/components/responses/ErrorResponse"
  /knowledge/search:
    get:
      tags: [knowledge]
      operationId: searchKnowledge
      summary: Search eligible published knowledge
      x-implementation-status: planned
      x-authorization:
        mode: public
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
            minLength: 2
        - name: language
          in: query
          schema:
            $ref: "#/components/schemas/LanguageCode"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Search results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchResponse"
        default:
          $ref: "#/components/responses/ErrorResponse"
  /workflows:
    get:
      tags: [workflows]
      operationId: listWorkflows
      summary: List published workflows
      x-implementation-status: planned
      x-authorization:
        mode: public
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Workflow list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkflowListResponse"
        default:
          $ref: "#/components/responses/ErrorResponse"
  /workflows/{workflowId}:
    get:
      tags: [workflows]
      operationId: getWorkflow
      summary: Get a published workflow and its ordered steps
      x-implementation-status: planned
      x-authorization:
        mode: public
      parameters:
        - $ref: "#/components/parameters/WorkflowId"
      responses:
        "200":
          description: Workflow detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkflowResponse"
        default:
          $ref: "#/components/responses/ErrorResponse"
  /workflows/{workflowId}/progress:
    put:
      tags: [workflows]
      operationId: updateWorkflowProgress
      summary: Replace the current principal or guest session workflow progress
      x-implementation-status: planned
      x-authorization:
        mode: optional-principal
      x-idempotency:
        mode: deterministic-replay
        replay: identical-progress
        conflict: stale-version
      parameters:
        - $ref: "#/components/parameters/WorkflowId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateWorkflowProgressRequest"
      responses:
        "200":
          description: Updated workflow progress
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkflowProgressResponse"
        default:
          $ref: "#/components/responses/ErrorResponse"
  /auth/guest:
    post:
      tags: [authentication]
      operationId: createGuestSession
      summary: Create an anonymous guest session
      x-implementation-status: planned
      x-authorization:
        mode: public
      x-idempotency:
        mode: caller-key
        replay: original-response
        conflict: different-request
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateGuestSessionRequest"
      responses:
        "201":
          description: Guest session created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSessionResponse"
        default:
          $ref: "#/components/responses/ErrorResponse"
  /auth/register:
    post:
      tags: [authentication]
      operationId: registerAccount
      summary: Register an account using the configured identity adapter
      x-implementation-status: planned
      x-authorization:
        mode: public
      x-idempotency:
        mode: caller-key
        replay: original-response
        conflict: different-request
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: Account and session created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSessionResponse"
        default:
          $ref: "#/components/responses/ErrorResponse"
  /auth/login:
    post:
      tags: [authentication]
      operationId: login
      summary: Authenticate using the configured identity adapter
      x-implementation-status: planned
      x-authorization:
        mode: public
      x-idempotency:
        mode: non-replayable
        replay: fresh-session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Authenticated session created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSessionResponse"
        default:
          $ref: "#/components/responses/ErrorResponse"
  /auth/refresh:
    post:
      tags: [authentication]
      operationId: refreshSession
      summary: Rotate a refresh token and issue a new access token
      x-implementation-status: planned
      x-authorization:
        mode: public
      x-idempotency:
        mode: token-rotation
        replay: rejected-after-use
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshSessionRequest"
      responses:
        "200":
          description: Session tokens rotated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSessionResponse"
        default:
          $ref: "#/components/responses/ErrorResponse"
  /auth/logout:
    post:
      tags: [authentication]
      operationId: logout
      summary: Revoke the current authenticated session
      x-implementation-status: planned
      x-authorization:
        mode: authenticated
        roles: []
      x-idempotency:
        mode: deterministic-replay
        replay: already-revoked
      security:
        - BearerAuth: []
      responses:
        "204":
          description: Session revoked or already revoked
        default:
          $ref: "#/components/responses/ErrorResponse"
  /auth/me:
    get:
      tags: [authentication]
      operationId: getAuthenticatedPrincipal
      summary: Get the authenticated internal principal
      x-authorization:
        mode: authenticated
        roles: []
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Authenticated principal and application roles
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PrincipalResponse"
        default:
          $ref: "#/components/responses/ErrorResponse"
  /profile:
    get:
      tags: [profiles]
      operationId: getProfile
      summary: Get the authenticated user's profile and preferences
      x-implementation-status: planned
      x-authorization:
        mode: authenticated
        roles: []
      security:
        - BearerAuth: []
      responses:
        "200":
          description: User profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfileResponse"
        default:
          $ref: "#/components/responses/ErrorResponse"
    patch:
      tags: [profiles]
      operationId: updateProfile
      summary: Update profile fields and preferences
      x-implementation-status: planned
      x-authorization:
        mode: authenticated
        roles: []
      x-idempotency:
        mode: deterministic-replay
        replay: identical-profile
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProfileRequest"
      responses:
        "200":
          description: Updated user profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfileResponse"
        default:
          $ref: "#/components/responses/ErrorResponse"
  /feedback:
    post:
      tags: [feedback]
      operationId: createFeedback
      summary: Submit feedback for a message or knowledge document
      x-implementation-status: planned
      x-authorization:
        mode: optional-principal
      x-idempotency:
        mode: caller-key
        replay: original-response
        conflict: different-request
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateFeedbackRequest"
      responses:
        "201":
          description: Feedback accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeedbackResponse"
        default:
          $ref: "#/components/responses/ErrorResponse"
  /admin/sources:
    get:
      tags: [ingestion]
      operationId: listAdminSources
      summary: List registered ingestion sources
      x-authorization:
        mode: role-gated
        roles: [admin]
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Registered source page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminSourceListResponse"
        default:
          $ref: "#/components/responses/ErrorResponse"
    post:
      tags: [ingestion]
      operationId: createAdminSource
      summary: Register an approved ingestion source
      x-implementation-status: planned
      x-authorization:
        mode: role-gated
        roles: [admin]
      x-idempotency:
        mode: caller-key
        replay: original-response
        conflict: different-request
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAdminSourceRequest"
      responses:
        "201":
          description: Source registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminSourceResponse"
        default:
          $ref: "#/components/responses/ErrorResponse"
  /admin/sources/{source_id}/uploads:
    post:
      tags: [ingestion]
      operationId: uploadAdminSourceDocument
      summary: Upload official source evidence for ingestion
      x-authorization:
        mode: role-gated
        roles: [admin]
      x-idempotency:
        mode: caller-key
        replay: original-response
        conflict: different-request
      security:
        - BearerAuth: []
      parameters:
        - name: source_id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ManualUploadRequest"
      responses:
        "200":
          description: Uploaded evidence processed or replayed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ManualUploadResponse"
        default:
          $ref: "#/components/responses/ErrorResponse"
  /admin/ingestion/jobs:
    get:
      tags: [ingestion]
      operationId: listIngestionJobs
      summary: List ingestion jobs
      x-authorization:
        mode: role-gated
        roles: [admin]
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Ingestion job page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IngestionJobListResponse"
        default:
          $ref: "#/components/responses/ErrorResponse"
    post:
      tags: [ingestion]
      operationId: createIngestionJob
      summary: Queue ingestion for an eligible source
      x-authorization:
        mode: role-gated
        roles: [admin]
      x-idempotency:
        mode: caller-key
        replay: original-response
        conflict: different-request
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateIngestionJobRequest"
      responses:
        "202":
          description: Ingestion job queued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IngestionJobResponse"
        default:
          $ref: "#/components/responses/ErrorResponse"
  /admin/reviews:
    get:
      tags: [administration]
      operationId: listReviewQueue
      summary: List review queue items
      x-authorization:
        mode: role-gated
        roles: [content_reviewer, admin]
      security:
        - BearerAuth: []
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [pending, in_review, approved, rejected, cancelled]
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
      responses:
        "200":
          description: Prioritized review queue with source context
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewQueueResponse"
        default:
          $ref: "#/components/responses/ErrorResponse"
  /admin/reviews/{review_item_id}/claim:
    post:
      tags: [administration]
      operationId: claimReviewItem
      summary: Claim a pending review item
      x-authorization:
        mode: role-gated
        roles: [content_reviewer, admin]
      x-idempotency:
        mode: deterministic-replay
        replay: same-reviewer-claim
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ReviewItemId"
      responses:
        "200":
          description: Review item claimed or same-reviewer claim replayed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewItemResponse"
        default:
          $ref: "#/components/responses/ErrorResponse"
  /admin/reviews/{review_item_id}/decision:
    post:
      tags: [administration]
      operationId: decideReviewItem
      summary: Approve or reject an assigned review item
      x-authorization:
        mode: role-gated
        roles: [content_reviewer, admin]
      x-idempotency:
        mode: state-transition
        replay: terminal-state-conflict
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ReviewItemId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReviewDecisionRequest"
      responses:
        "200":
          description: Review decision persisted with immutable audit lineage
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewItemResponse"
        default:
          $ref: "#/components/responses/ErrorResponse"
  /admin/artifacts/{artifact_id}:
    get:
      tags: [administration]
      operationId: getExtractionArtifact
      summary: Get a checksum-verified extraction artifact
      x-authorization:
        mode: role-gated
        roles: [content_reviewer, admin]
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ArtifactId"
      responses:
        "200":
          description: Checksum-verified artifact content and evidence lineage
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArtifactDetailResponse"
        default:
          $ref: "#/components/responses/ErrorResponse"
  /admin/artifacts/{artifact_id}/comparison:
    get:
      tags: [administration]
      operationId: compareExtractionArtifact
      summary: Compare an extraction artifact with its previous approved version
      x-authorization:
        mode: role-gated
        roles: [content_reviewer, admin]
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ArtifactId"
      responses:
        "200":
          description: Section-level artifact comparison
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArtifactComparisonResponse"
        default:
          $ref: "#/components/responses/ErrorResponse"
  /admin/publications:
    post:
      tags: [administration]
      operationId: publishKnowledgeCandidate
      summary: Publish an approved knowledge candidate
      x-authorization:
        mode: role-gated
        roles: [knowledge_publisher, admin]
      x-idempotency:
        mode: deterministic-replay
        replay: candidate-checksum
        conflict: changed-candidate
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PublicationCandidate"
      responses:
        "200":
          description: Candidate published or exact publication replayed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicationResponse"
        default:
          $ref: "#/components/responses/ErrorResponse"
  /admin/documents/{document_id}/expire:
    post:
      tags: [administration]
      operationId: expireKnowledgeDocument
      summary: Expire a published knowledge document
      x-authorization:
        mode: role-gated
        roles: [knowledge_publisher, admin]
      x-idempotency:
        mode: deterministic-replay
        replay: current-version-expiration
        conflict: document-not-published
      security:
        - BearerAuth: []
      parameters:
        - name: document_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExpireDocumentRequest"
      responses:
        "200":
          description: Document expired or exact expiration replayed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExpireDocumentResponse"
        default:
          $ref: "#/components/responses/ErrorResponse"
  /admin/documents/{document_id}/reindex:
    post:
      tags: [administration]
      operationId: reindexKnowledgeDocument
      summary: Queue a published knowledge document for re-indexing
      x-authorization:
        mode: role-gated
        roles: [knowledge_publisher, admin]
      x-idempotency:
        mode: caller-key
        replay: current-version-index-job
        conflict: different-model
      security:
        - BearerAuth: []
      parameters:
        - name: document_id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReindexDocumentRequest"
      responses:
        "200":
          description: Index job queued or exact request replayed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IndexJobResponse"
        default:
          $ref: "#/components/responses/ErrorResponse"
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      description: >-
        Token verified by a configured trusted identity adapter. The API never
        trusts principal IDs or roles supplied directly by the caller.
  parameters:
    Cursor:
      name: cursor
      in: query
      description: Opaque cursor returned in the previous response metadata.
      schema:
        type: string
        minLength: 1
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    IdempotencyKey:
