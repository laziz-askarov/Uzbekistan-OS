    PublicationCandidate:
      type: object
      required:
        - review_item_id
        - slug
        - domain
        - language
        - version
        - title
        - summary
        - sections
        - effective_from
        - effective_until
      properties:
        review_item_id: { type: string, format: uuid }
        slug: { type: string, pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$" }
        domain: { $ref: "#/components/schemas/DomainSlug" }
        topic: { type: [string, "null"], minLength: 2, maxLength: 120 }
        language: { $ref: "#/components/schemas/LanguageCode" }
        version: { $ref: "#/components/schemas/CandidateVersion" }
        title: { type: string, minLength: 1, maxLength: 500 }
        summary: { type: string, minLength: 1 }
        audiences:
          type: array
          items: { type: string }
          uniqueItems: true
          default: []
        nationalities:
          type: array
          items: { type: string, pattern: "^[A-Z]{2}$" }
          uniqueItems: true
          default: []
        residency_statuses:
          type: array
          items: { type: string, minLength: 1 }
          uniqueItems: true
          default: []
        locations:
          type: array
          items: { type: string, minLength: 1 }
          uniqueItems: true
          default: []
        applicability_conditions:
          type: array
          items: { type: string, minLength: 1 }
          uniqueItems: true
          default: []
        keywords:
          type: array
          items: { type: string }
          uniqueItems: true
          default: []
        requirements:
          type: array
          items: { $ref: "#/components/schemas/CandidateRequirement" }
          default: []
        steps:
          type: array
          items: { $ref: "#/components/schemas/CandidateStep" }
          default: []
        fees:
          type: array
          items: { $ref: "#/components/schemas/CandidateFee" }
          default: []
        processing_time:
          oneOf:
            - { $ref: "#/components/schemas/CandidateProcessingTime" }
            - { type: "null" }
        sections:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/CandidateSection" }
        effective_from: { type: string, format: date }
        effective_until: { type: string, format: date }
        translation_of_id: { type: [string, "null"], format: uuid }
      additionalProperties: false
    PublicationResult:
      type: object
      required:
        - publication_id
        - document_id
        - document_version_id
        - candidate_sha256
        - published_at
      properties:
        publication_id: { type: string, format: uuid }
        document_id: { type: string, format: uuid }
        document_version_id: { type: string, format: uuid }
        candidate_sha256: { type: string, pattern: "^[a-f0-9]{64}$" }
        published_at: { type: string, format: date-time }
      additionalProperties: false
    PublicationResponse:
      type: object
      required: [data, meta]
      properties:
        data: { $ref: "#/components/schemas/PublicationResult" }
        meta: { $ref: "#/components/schemas/ResponseMeta" }
      additionalProperties: false
    ExpireDocumentRequest:
      type: object
      required: [reason]
      properties:
        reason: { type: string, minLength: 1, maxLength: 2000 }
      additionalProperties: false
    ExpireDocumentResult:
      type: object
      required:
        - lifecycle_event_id
        - document_id
        - document_version_id
        - status
        - reason
        - expired_at
      properties:
        lifecycle_event_id: { type: string, format: uuid }
        document_id: { type: string, format: uuid }
        document_version_id: { type: string, format: uuid }
        status: { type: string, const: expired }
        reason: { type: string }
        expired_at: { type: string, format: date-time }
      additionalProperties: false
    ExpireDocumentResponse:
      type: object
      required: [data, meta]
      properties:
        data: { $ref: "#/components/schemas/ExpireDocumentResult" }
        meta: { $ref: "#/components/schemas/ResponseMeta" }
      additionalProperties: false
    ReindexDocumentRequest:
      type: object
      required: [model_key]
      properties:
        model_key: { type: string, minLength: 1, maxLength: 160 }
        max_attempts: { type: integer, minimum: 1, maximum: 10, default: 3 }
      additionalProperties: false
    IndexJobResult:
      type: object
      required:
        - index_job_id
        - document_id
        - document_version_id
        - idempotency_key
        - model_key
        - status
        - attempt_count
        - max_attempts
        - scheduled_at
      properties:
        index_job_id: { type: string, format: uuid }
        document_id: { type: string, format: uuid }
        document_version_id: { type: string, format: uuid }
        idempotency_key: { type: string }
        model_key: { type: string }
        status:
          type: string
          enum:
            [
              queued,
              running,
              retry_scheduled,
              succeeded,
              dead_lettered,
              cancelled,
            ]
        attempt_count: { type: integer, minimum: 0 }
        max_attempts: { type: integer, minimum: 1 }
        scheduled_at: { type: string, format: date-time }
      additionalProperties: false
    IndexJobResponse:
      type: object
      required: [data, meta]
      properties:
        data: { $ref: "#/components/schemas/IndexJobResult" }
        meta: { $ref: "#/components/schemas/ResponseMeta" }
      additionalProperties: false
    ErrorDetail:
      type: object
      required: [code, message, details]
      properties:
        code: { type: string }
        message: { type: string }
        details: { type: object }
      additionalProperties: false
    ErrorResponse:
      type: object
      required: [error, meta]
      properties:
        error: { $ref: "#/components/schemas/ErrorDetail" }
        meta: { $ref: "#/components/schemas/ResponseMeta" }
      additionalProperties: false
