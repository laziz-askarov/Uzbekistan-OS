openapi: 3.1.0
info:
  title: Uzbekistan OS API
  version: 0.1.0
  description: >-
    Contract skeleton for the Uzbekistan OS public API. Paths marked with
    x-implementation-status: planned are not implemented yet.
servers:
  - url: http://localhost:8000/api/v1
    description: Local development
security: []
tags:
  - name: system
  - name: authentication
  - name: profiles
  - name: conversations
  - name: knowledge
  - name: workflows
  - name: feedback
  - name: ingestion
  - name: administration
  - name: assistant
  - name: editorial-content
paths:
  /health:
    get:
      tags: [system]
      operationId: getHealth
      summary: Get API health
      x-authorization:
        mode: public
      responses:
        "200":
          description: Service is healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /ready:
    get:
      tags: [system]
      operationId: getReadiness
      summary: Check service dependencies
      x-authorization:
        mode: public
      responses:
        "200":
          description: Required service dependencies are available
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadinessResponse"
        "503":
          $ref: "#/components/responses/ErrorResponse"
  /conversations:
    get:
      tags: [conversations]
      operationId: listConversations
      summary: List conversations for the current principal or guest session
      x-implementation-status: planned
      x-authorization:
        mode: optional-principal
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Conversation page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConversationListResponse"
        default:
          $ref: "#/components/responses/ErrorResponse"
    post:
      tags: [conversations]
      operationId: createConversation
      summary: Create a conversation
      x-implementation-status: planned
      x-authorization:
        mode: optional-principal
      x-idempotency:
        mode: caller-key
        replay: original-response
        conflict: different-request
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateConversationRequest"
      responses:
        "201":
          description: Conversation created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConversationResponse"
        default:
          $ref: "#/components/responses/ErrorResponse"
  /conversations/{conversationId}:
    get:
      tags: [conversations]
      operationId: getConversation
      summary: Get a conversation
      x-implementation-status: planned
      x-authorization:
        mode: optional-principal
      parameters:
        - $ref: "#/components/parameters/ConversationId"
      responses:
        "200":
          description: Conversation detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConversationResponse"
        default:
          $ref: "#/components/responses/ErrorResponse"
    delete:
      tags: [conversations]
      operationId: deleteConversation
      summary: Soft-delete a conversation
      x-implementation-status: planned
      x-authorization:
        mode: optional-principal
      x-idempotency:
        mode: deterministic-replay
        replay: already-deleted
      parameters:
        - $ref: "#/components/parameters/ConversationId"
      responses:
        "204":
          description: Conversation deleted or already deleted
        default:
          $ref: "#/components/responses/ErrorResponse"
  /conversations/{conversationId}/messages:
    get:
      tags: [conversations]
      operationId: listConversationMessages
      summary: List persisted messages in a conversation
      x-implementation-status: planned
      x-authorization:
        mode: optional-principal
      parameters:
        - $ref: "#/components/parameters/ConversationId"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Conversation message page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageListResponse"
        default:
          $ref: "#/components/responses/ErrorResponse"
    post:
      tags: [conversations]
      operationId: sendMessage
      summary: Send a message and stream the assistant response
      description: >-
        Emits application-owned SSE events: start, context, chunk, citation,
        workflow, done, and error. Provider-specific stream events are never exposed.
      x-implementation-status: planned
      x-authorization:
        mode: optional-principal
      x-idempotency:
        mode: caller-key
        replay: original-stream-outcome
        conflict: different-request
      x-sse-events:
        - $ref: "#/components/schemas/StreamStartEvent"
        - $ref: "#/components/schemas/StreamContextEvent"
        - $ref: "#/components/schemas/StreamChunkEvent"
        - $ref: "#/components/schemas/StreamCitationEvent"
        - $ref: "#/components/schemas/StreamWorkflowEvent"
        - $ref: "#/components/schemas/StreamDoneEvent"
        - $ref: "#/components/schemas/StreamErrorEvent"
      parameters:
        - $ref: "#/components/parameters/ConversationId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SendMessageRequest"
      responses:
        "200":
          description: SSE response stream
          content:
            text/event-stream:
              schema:
                type: string
        default:
          $ref: "#/components/responses/ErrorResponse"
  /knowledge/{documentId}:
    get:
      tags: [knowledge]
      operationId: getKnowledgeDocument
      summary: Get an eligible published knowledge document
      x-implementation-status: planned
      x-authorization:
        mode: public
      parameters:
        - $ref: "#/components/parameters/DocumentId"
      responses:
        "200":
          description: Published knowledge document
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KnowledgeDocumentResponse"
        default:
          $ref: "#/components/responses/ErrorResponse"
  /knowledge/{documentId}/sources:
    get:
      tags: [knowledge]
      operationId: listKnowledgeDocumentSources
      summary: List official evidence for a published knowledge document
      x-implementation-status: planned
      x-authorization:
        mode: public
      parameters:
        - $ref: "#/components/parameters/DocumentId"
      responses:
        "200":
          description: Document source evidence
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KnowledgeSourceListResponse"
        default:
          $ref: "#/components/responses/ErrorResponse"
  /knowledge/search:
    get:
      tags: [knowledge]
      operationId: searchKnowledge
      summary: Search eligible published knowledge
      x-implementation-status: planned
      x-authorization:
        mode: public
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
            minLength: 2
        - name: language
          in: query
          schema:
            $ref: "#/components/schemas/LanguageCode"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Search results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchResponse"
        default:
          $ref: "#/components/responses/ErrorResponse"
  /workflows:
    get:
      tags: [workflows]
      operationId: listWorkflows
      summary: List published workflows
      x-implementation-status: planned
      x-authorization:
        mode: public
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Workflow list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkflowListResponse"
        default:
          $ref: "#/components/responses/ErrorResponse"
  /workflows/{workflowId}:
    get:
      tags: [workflows]
      operationId: getWorkflow
      summary: Get a published workflow and its ordered steps
      x-implementation-status: planned
      x-authorization:
        mode: public
      parameters:
        - $ref: "#/components/parameters/WorkflowId"
      responses:
        "200":
          description: Workflow detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkflowResponse"
        default:
          $ref: "#/components/responses/ErrorResponse"
  /workflows/{workflowId}/progress:
    put:
      tags: [workflows]
      operationId: updateWorkflowProgress
      summary: Replace the current principal or guest session workflow progress
      x-implementation-status: planned
      x-authorization:
        mode: optional-principal
      x-idempotency:
        mode: deterministic-replay
        replay: identical-progress
        conflict: stale-version
      parameters:
        - $ref: "#/components/parameters/WorkflowId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateWorkflowProgressRequest"
      responses:
        "200":
          description: Updated workflow progress
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkflowProgressResponse"
        default:
          $ref: "#/components/responses/ErrorResponse"
  /auth/guest:
    post:
      tags: [authentication]
      operationId: createGuestSession
      summary: Create an anonymous guest session
      x-implementation-status: planned
      x-authorization:
        mode: public
      x-idempotency:
        mode: caller-key
        replay: original-response
        conflict: different-request
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateGuestSessionRequest"
      responses:
        "201":
          description: Guest session created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSessionResponse"
        default:
          $ref: "#/components/responses/ErrorResponse"
  /auth/register:
    post:
      tags: [authentication]
      operationId: registerAccount
      summary: Register an account using the configured identity adapter
      x-implementation-status: planned
      x-authorization:
        mode: public
      x-idempotency:
        mode: caller-key
        replay: original-response
        conflict: different-request
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: Account and session created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSessionResponse"
        default:
          $ref: "#/components/responses/ErrorResponse"
  /auth/login:
    post:
      tags: [authentication]
      operationId: login
      summary: Authenticate using the configured identity adapter
      x-implementation-status: planned
      x-authorization:
        mode: public
      x-idempotency:
        mode: non-replayable
        replay: fresh-session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Authenticated session created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSessionResponse"
        default:
          $ref: "#/components/responses/ErrorResponse"
  /auth/refresh:
    post:
      tags: [authentication]
      operationId: refreshSession
      summary: Rotate a refresh token and issue a new access token
      x-implementation-status: planned
      x-authorization:
        mode: public
      x-idempotency:
        mode: token-rotation
        replay: rejected-after-use
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshSessionRequest"
      responses:
        "200":
          description: Session tokens rotated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSessionResponse"
        default:
          $ref: "#/components/responses/ErrorResponse"
  /auth/logout:
    post:
      tags: [authentication]
      operationId: logout
      summary: Revoke the current authenticated session
      x-implementation-status: planned
      x-authorization:
        mode: authenticated
        roles: []
      x-idempotency:
        mode: deterministic-replay
        replay: already-revoked
      security:
        - BearerAuth: []
      responses:
        "204":
          description: Session revoked or already revoked
        default:
          $ref: "#/components/responses/ErrorResponse"
  /auth/me:
    get:
      tags: [authentication]
      operationId: getAuthenticatedPrincipal
      summary: Get the authenticated internal principal
      x-authorization:
        mode: authenticated
        roles: []
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Authenticated principal and application roles
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PrincipalResponse"
        default:
          $ref: "#/components/responses/ErrorResponse"
  /profile:
    get:
      tags: [profiles]
      operationId: getProfile
      summary: Get the authenticated user's profile and preferences
      x-implementation-status: planned
      x-authorization:
        mode: authenticated
        roles: []
      security:
        - BearerAuth: []
      responses:
        "200":
          description: User profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfileResponse"
        default:
          $ref: "#/components/responses/ErrorResponse"
    patch:
      tags: [profiles]
      operationId: updateProfile
      summary: Update profile fields and preferences
      x-implementation-status: planned
      x-authorization:
        mode: authenticated
        roles: []
      x-idempotency:
        mode: deterministic-replay
        replay: identical-profile
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProfileRequest"
      responses:
        "200":
          description: Updated user profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfileResponse"
        default:
          $ref: "#/components/responses/ErrorResponse"
  /feedback:
    post:
      tags: [feedback]
      operationId: createFeedback
      summary: Submit feedback for a message or knowledge document
      x-implementation-status: planned
      x-authorization:
        mode: optional-principal
      x-idempotency:
        mode: caller-key
        replay: original-response
        conflict: different-request
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateFeedbackRequest"
      responses:
        "201":
          description: Feedback accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeedbackResponse"
        default:
          $ref: "#/components/responses/ErrorResponse"
  /assistant/answer:
    post:
      tags: [assistant]
      operationId: answerGroundedQuestion
      summary: Answer from eligible official evidence with a bounded live fallback
      x-authorization:
        mode: authenticated
        roles: []
      x-idempotency:
        mode: none
        reason: The endpoint performs bounded generation and does not mutate application state.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssistantAnswerRequest"
      responses:
        "200":
          description: Grounded local or live-source answer, or safe insufficiency
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssistantAnswerResponse"
        default:
          $ref: "#/components/responses/ErrorResponse"
  /admin/sources:
    get:
      tags: [ingestion]
      operationId: listAdminSources
      summary: List registered ingestion sources
      x-authorization:
        mode: role-gated
        roles: [admin]
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Registered source page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminSourceListResponse"
        default:
          $ref: "#/components/responses/ErrorResponse"
    post:
      tags: [ingestion]
      operationId: createAdminSource
      summary: Register an official manual evidence source
      x-authorization:
        mode: role-gated
        roles: [admin]
      x-idempotency:
        mode: caller-key
        replay: original-response
        conflict: different-request
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAdminSourceRequest"
      responses:
        "201":
          description: Source registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminSourceResponse"
        default:
          $ref: "#/components/responses/ErrorResponse"
  /admin/sources/{source_id}/uploads:
    post:
      tags: [ingestion]
      operationId: uploadAdminSourceDocument
      summary: Upload official source evidence for ingestion
      x-authorization:
        mode: role-gated
        roles: [admin]
      x-idempotency:
        mode: caller-key
        replay: original-response
        conflict: different-request
      security:
        - BearerAuth: []
      parameters:
        - name: source_id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ManualUploadRequest"
      responses:
        "200":
          description: Uploaded evidence processed or replayed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ManualUploadResponse"
        default:
          $ref: "#/components/responses/ErrorResponse"
  /admin/sources/{source_id}:
    put:
      tags: [ingestion]
      operationId: updateAdminSource
      summary: Update audited official source metadata
      x-authorization:
        mode: role-gated
        roles: [admin]
      x-idempotency:
        mode: deterministic-replay
        replay: identical-source-metadata
        conflict: none
      security:
        - BearerAuth: []
      parameters:
        - name: source_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateAdminSourceRequest"
      responses:
        "200":
          description: Source metadata updated and audit logged
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminSourceResponse"
        default:
          $ref: "#/components/responses/ErrorResponse"
  /admin/ingestion/jobs:
    get:
      tags: [ingestion]
      operationId: listIngestionJobs
      summary: List ingestion jobs
      x-authorization:
        mode: role-gated
        roles: [admin]
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Ingestion job page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IngestionJobListResponse"
        default:
          $ref: "#/components/responses/ErrorResponse"
    post:
      tags: [ingestion]
      operationId: createIngestionJob
      summary: Queue ingestion for an eligible source
      x-authorization:
        mode: role-gated
        roles: [admin]
      x-idempotency:
        mode: caller-key
        replay: original-response
        conflict: different-request
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateIngestionJobRequest"
      responses:
        "202":
          description: Ingestion job queued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IngestionJobResponse"
        default:
          $ref: "#/components/responses/ErrorResponse"
  /admin/ingestion/topics:
    get:
      tags: [ingestion]
      operationId: listIngestionTopics
      summary: List topics used by manual evidence uploads
      x-authorization:
        mode: role-gated
        roles: [admin]
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Previously used evidence topics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IngestionTopicListResponse"
        default:
          $ref: "#/components/responses/ErrorResponse"
  /admin/reviews:
    get:
      tags: [administration]
      operationId: listReviewQueue
      summary: List review queue items
      x-authorization:
        mode: role-gated
        roles: [content_reviewer, admin]
      security:
        - BearerAuth: []
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [pending, in_review, approved, rejected, cancelled]
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
      responses:
        "200":
          description: Prioritized review queue with source context
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewQueueResponse"
        default:
          $ref: "#/components/responses/ErrorResponse"
  /admin/reviews/{review_item_id}/claim:
    post:
      tags: [administration]
      operationId: claimReviewItem
      summary: Claim a pending review item
      x-authorization:
        mode: role-gated
        roles: [content_reviewer, admin]
      x-idempotency:
        mode: deterministic-replay
        replay: same-reviewer-claim
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ReviewItemId"
      responses:
        "200":
          description: Review item claimed or same-reviewer claim replayed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewItemResponse"
        default:
          $ref: "#/components/responses/ErrorResponse"
  /admin/reviews/{review_item_id}/decision:
    post:
      tags: [administration]
      operationId: decideReviewItem
      summary: Approve or reject an assigned review item
      x-authorization:
        mode: role-gated
        roles: [content_reviewer, admin]
      x-idempotency:
        mode: state-transition
        replay: terminal-state-conflict
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ReviewItemId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReviewDecisionRequest"
      responses:
        "200":
          description: Review decision persisted with immutable audit lineage
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewItemResponse"
        default:
          $ref: "#/components/responses/ErrorResponse"
  /admin/artifacts/{artifact_id}:
    get:
      tags: [administration]
      operationId: getExtractionArtifact
      summary: Get a checksum-verified extraction artifact
      x-authorization:
        mode: role-gated
        roles: [content_reviewer, admin]
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ArtifactId"
      responses:
        "200":
          description: Checksum-verified artifact content and evidence lineage
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArtifactDetailResponse"
        default:
          $ref: "#/components/responses/ErrorResponse"
  /admin/artifacts/{artifact_id}/comparison:
    get:
      tags: [administration]
      operationId: compareExtractionArtifact
      summary: Compare an extraction artifact with its previous approved version
      x-authorization:
        mode: role-gated
        roles: [content_reviewer, admin]
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ArtifactId"
      responses:
        "200":
          description: Section-level artifact comparison
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArtifactComparisonResponse"
        default:
          $ref: "#/components/responses/ErrorResponse"
  /admin/publications:
    post:
      tags: [administration]
      operationId: publishKnowledgeCandidate
      summary: Publish an approved knowledge candidate
      x-authorization:
        mode: role-gated
        roles: [knowledge_publisher, admin]
      x-idempotency:
        mode: deterministic-replay
        replay: candidate-checksum
        conflict: changed-candidate
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PublicationCandidate"
      responses:
        "200":
          description: Candidate published or exact publication replayed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicationResponse"
        default:
          $ref: "#/components/responses/ErrorResponse"
  /admin/documents/{document_id}/expire:
    post:
      tags: [administration]
      operationId: expireKnowledgeDocument
      summary: Expire a published knowledge document
      x-authorization:
        mode: role-gated
        roles: [knowledge_publisher, admin]
      x-idempotency:
        mode: deterministic-replay
        replay: current-version-expiration
        conflict: document-not-published
      security:
        - BearerAuth: []
      parameters:
        - name: document_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExpireDocumentRequest"
      responses:
        "200":
          description: Document expired or exact expiration replayed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExpireDocumentResponse"
        default:
          $ref: "#/components/responses/ErrorResponse"
  /admin/documents/{document_id}/reindex:
    post:
      tags: [administration]
      operationId: reindexKnowledgeDocument
      summary: Queue a published knowledge document for re-indexing
      x-authorization:
        mode: role-gated
        roles: [knowledge_publisher, admin]
      x-idempotency:
        mode: caller-key
        replay: current-version-index-job
        conflict: different-model
      security:
        - BearerAuth: []
      parameters:
        - name: document_id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReindexDocumentRequest"
      responses:
        "200":
          description: Index job queued or exact request replayed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IndexJobResponse"
        default:
          $ref: "#/components/responses/ErrorResponse"
  /admin/content/authors:
    get:
      tags: [editorial-content]
      operationId: listEditorialAuthors
      summary: List active editorial authors
      x-authorization:
        mode: role-gated
        roles: [content_author, content_reviewer, knowledge_publisher, admin]
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Active editorial authors
          content:
            application/json:
              schema:
                { $ref: "#/components/schemas/EditorialAuthorListResponse" }
        default: { $ref: "#/components/responses/ErrorResponse" }
    post:
      tags: [editorial-content]
      operationId: createEditorialAuthor
      summary: Create the current staff member's editorial author profile
      x-authorization:
        mode: role-gated
        roles: [content_author, admin]
      x-idempotency:
        mode: natural-key
        replay: principal-author-profile
        conflict: principal-or-slug-already-exists
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EditorialAuthorDraft" }
      responses:
        "201":
          description: Author profile created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EditorialAuthorResponse" }
        default: { $ref: "#/components/responses/ErrorResponse" }
  /admin/content/reviewed-sources:
    get:
      tags: [editorial-content]
      operationId: listReviewedEditorialSources
      summary: List current reviewed knowledge publications available for editorial citation
      x-authorization:
        mode: role-gated
        roles: [content_author, content_reviewer, knowledge_publisher, admin]
      security:
        - BearerAuth: []
      parameters:
        - name: domain
          in: query
          schema:
            oneOf:
              - $ref: "#/components/schemas/DomainSlug"
              - type: "null"
        - name: language
          in: query
          schema:
            oneOf:
              - $ref: "#/components/schemas/LanguageCode"
              - type: "null"
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 200 }
      responses:
        "200":
          description: Current reviewed knowledge publications
          content:
            application/json:
              schema:
                {
                  $ref: "#/components/schemas/ReviewedKnowledgeSourceListResponse",
                }
        default: { $ref: "#/components/responses/ErrorResponse" }
  /admin/content/posts:
    get:
      tags: [editorial-content]
      operationId: listEditorialPosts
      summary: List editorial posts by latest revision status
      x-authorization:
        mode: role-gated
        roles: [content_author, content_reviewer, knowledge_publisher, admin]
      security:
        - BearerAuth: []
      parameters:
        - name: status
          in: query
          schema: { $ref: "#/components/schemas/EditorialStatus" }
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Editorial posts and latest revision state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EditorialPostListResponse" }
        default: { $ref: "#/components/responses/ErrorResponse" }
    post:
      tags: [editorial-content]
      operationId: createEditorialPost
      summary: Create a new editorial post draft
      x-authorization:
        mode: role-gated
        roles: [content_author, admin]
      x-idempotency:
        mode: natural-key
        replay: post-slug
        conflict: slug-already-exists
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EditorialPostDraft" }
      responses:
        "201":
          description: Initial draft revision created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EditorialRevisionResponse" }
        default: { $ref: "#/components/responses/ErrorResponse" }
  /admin/content/posts/{post_id}/revisions:
    post:
      tags: [editorial-content]
      operationId: createEditorialRevision
      summary: Create a new draft revision for a published post
      x-authorization:
        mode: role-gated
        roles: [content_author, admin]
      x-idempotency:
        mode: deterministic-replay
        replay: existing-open-revision
        conflict: unpublished-revision-already-exists
      security:
        - BearerAuth: []
      parameters:
        - name: post_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EditorialRevisionDraft" }
      responses:
        "201":
          description: Draft revision created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EditorialRevisionResponse" }
        default: { $ref: "#/components/responses/ErrorResponse" }
  /admin/content/revisions/{revision_id}:
    get:
      tags: [editorial-content]
      operationId: getEditorialRevision
      summary: Get an editorial revision and its source citations
      x-authorization:
        mode: role-gated
        roles: [content_author, content_reviewer, knowledge_publisher, admin]
      security:
        - BearerAuth: []
      parameters:
        - name: revision_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Editorial revision detail
          content:
            application/json:
              schema:
                { $ref: "#/components/schemas/EditorialRevisionDetailResponse" }
        default: { $ref: "#/components/responses/ErrorResponse" }
    put:
      tags: [editorial-content]
      operationId: updateEditorialRevision
      summary: Update an editable editorial draft
      x-authorization:
        mode: role-gated
        roles: [content_author, admin]
      x-idempotency:
        mode: deterministic-replay
        replay: revision-checksum
        conflict: revision-not-draft
      security:
        - BearerAuth: []
      parameters:
        - name: revision_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EditorialRevisionDraft" }
      responses:
        "200":
          description: Updated draft detail
          content:
            application/json:
              schema:
                { $ref: "#/components/schemas/EditorialRevisionDetailResponse" }
        default: { $ref: "#/components/responses/ErrorResponse" }
  /admin/content/revisions/{revision_id}/submit:
    post:
      tags: [editorial-content]
      operationId: submitEditorialRevision
      summary: Submit an editorial draft for review
      x-authorization:
        mode: role-gated
        roles: [content_author, admin]
      x-idempotency:
        mode: state-transition
        replay: submitted-revision
        conflict: revision-not-draft
      security:
        - BearerAuth: []
      parameters:
        - name: revision_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Revision submitted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EditorialRevisionResponse" }
        default: { $ref: "#/components/responses/ErrorResponse" }
  /admin/content/revisions/{revision_id}/decision:
    post:
      tags: [editorial-content]
      operationId: decideEditorialRevision
      summary: Approve an editorial revision or request changes
      x-authorization:
        mode: role-gated
        roles: [content_reviewer, admin]
      x-idempotency:
        mode: state-transition
        replay: recorded-decision
        conflict: revision-not-in-review
      security:
        - BearerAuth: []
      parameters:
        - name: revision_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EditorialDecisionRequest" }
      responses:
        "200":
          description: Review decision recorded
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EditorialRevisionResponse" }
        default: { $ref: "#/components/responses/ErrorResponse" }
  /admin/content/revisions/{revision_id}/publish:
    post:
      tags: [editorial-content]
      operationId: publishEditorialRevision
      summary: Publish an approved editorial revision
      x-authorization:
        mode: role-gated
        roles: [knowledge_publisher, admin]
      x-idempotency:
        mode: state-transition
        replay: publication-record
        conflict: revision-not-approved
      security:
        - BearerAuth: []
      parameters:
        - name: revision_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Revision published
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EditorialRevisionResponse" }
        default: { $ref: "#/components/responses/ErrorResponse" }
  /content/posts:
    get:
      tags: [editorial-content]
      operationId: listPublishedEditorialPosts
      summary: List currently published editorial posts
      x-authorization:
        mode: public
      security: []
      parameters:
        - name: domain
          in: query
          schema:
            oneOf:
              - $ref: "#/components/schemas/DomainSlug"
              - type: "null"
        - name: language
          in: query
          schema:
            oneOf:
              - $ref: "#/components/schemas/LanguageCode"
              - type: "null"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Current published editorial posts only
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PublishedPostListResponse" }
        default: { $ref: "#/components/responses/ErrorResponse" }
  /content/posts/{slug}:
    get:
      tags: [editorial-content]
      operationId: getPublishedEditorialPost
      summary: Get the current published revision of an editorial post
      x-authorization:
        mode: public
      security: []
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
            pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$"
      responses:
        "200":
          description: Current published revision with author and source lineage
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PublishedPostResponse" }
        default: { $ref: "#/components/responses/ErrorResponse" }
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      description: >-
        Token verified by a configured trusted identity adapter. The API never
        trusts principal IDs or roles supplied directly by the caller.
  parameters:
    Cursor:
      name: cursor
      in: query
      description: Opaque cursor returned in the previous response metadata.
      schema:
        type: string
        minLength: 1
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Caller-generated opaque key scoped to the authenticated or guest session.
      schema:
        type: string
        minLength: 8
        maxLength: 128
        pattern: "^[A-Za-z0-9._:-]+$"
    ConversationId:
      name: conversationId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    DocumentId:
      name: documentId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    WorkflowId:
      name: workflowId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ReviewItemId:
      name: review_item_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ArtifactId:
      name: artifact_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  responses:
    ErrorResponse:
      description: Request failed
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    LanguageCode:
      type: string
      enum: [en, uz, ru]
    DomainSlug:
      type: string
      enum:
        [
          immigration,
          tourism,
          business-registration,
          healthcare,
          everyday-living,
        ]
    EditorialStatus:
      type: string
      enum: [draft, in_review, approved, published, stale, archived]
    EditorialContentType:
      type: string
      enum: [article, guide, platform_update, interview]
    EditorialAuthorDraft:
      type: object
      required: [slug, name]
      properties:
        slug:
          type: string
          pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$"
        name: { type: string, minLength: 1, maxLength: 240 }
        bio: { type: [string, "null"], maxLength: 5000 }
        avatar_url: { type: [string, "null"], maxLength: 2000 }
        profile_url: { type: [string, "null"], maxLength: 2000 }
      additionalProperties: false
    EditorialAuthorData:
      type: object
      required:
        [id, principal_id, slug, name, bio, avatar_url, profile_url, is_active]
      properties:
        id: { type: string, format: uuid }
        principal_id: { type: [string, "null"], format: uuid }
        slug: { type: string }
        name: { type: string }
        bio: { type: [string, "null"] }
        avatar_url: { type: [string, "null"] }
        profile_url: { type: [string, "null"] }
        is_active: { type: boolean }
      additionalProperties: false
    EditorialSourceReference:
      type: object
      required: [source_id, locator]
      properties:
        source_id: { type: string, format: uuid }
        document_version_id: { type: [string, "null"], format: uuid }
        locator: { type: string, minLength: 1, maxLength: 2000 }
        quote: { type: [string, "null"], maxLength: 5000 }
      additionalProperties: false
    EditorialRevisionDraft:
      type: object
      required: [author_id, title, summary, body_markdown]
      properties:
        author_id: { type: string, format: uuid }
        title: { type: string, minLength: 1, maxLength: 500 }
        summary: { type: string, minLength: 1, maxLength: 2000 }
        body_markdown: { type: string, minLength: 1 }
        structured_content:
          type: object
          additionalProperties: true
        seo_title: { type: [string, "null"], maxLength: 70 }
        seo_description: { type: [string, "null"], maxLength: 200 }
        canonical_url: { type: [string, "null"], maxLength: 2000 }
        hero_image_url: { type: [string, "null"], maxLength: 2000 }
        hero_image_alt: { type: [string, "null"], maxLength: 500 }
        include_in_rag: { type: boolean, default: false }
        sources:
          type: array
          items: { $ref: "#/components/schemas/EditorialSourceReference" }
      additionalProperties: false
    EditorialPostDraft:
      allOf:
        - $ref: "#/components/schemas/EditorialRevisionDraft"
        - type: object
          required: [slug, content_type, language_code]
          properties:
            slug:
              type: string
              pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$"
            content_type: { $ref: "#/components/schemas/EditorialContentType" }
            domain_slug:
              oneOf:
                - $ref: "#/components/schemas/DomainSlug"
                - type: "null"
            language_code: { $ref: "#/components/schemas/LanguageCode" }
            translation_group_id: { type: [string, "null"], format: uuid }
    EditorialRevisionData:
      type: object
      required:
        - id
        - post_id
        - version_number
        - content_type
        - status
        - checksum_sha256
        - created_by_principal_id
        - include_in_rag
        - submitted_at
        - reviewed_by_principal_id
        - reviewed_at
        - decision_reason
        - published_by_principal_id
        - published_at
        - updated_at
      properties:
        id: { type: string, format: uuid }
        post_id: { type: string, format: uuid }
        version_number: { type: integer, minimum: 1 }
        content_type: { $ref: "#/components/schemas/EditorialContentType" }
        status: { $ref: "#/components/schemas/EditorialStatus" }
        checksum_sha256: { type: string, pattern: "^[a-f0-9]{64}$" }
        created_by_principal_id: { type: string, format: uuid }
        include_in_rag: { type: boolean }
        submitted_at: { type: [string, "null"], format: date-time }
        reviewed_by_principal_id: { type: [string, "null"], format: uuid }
        reviewed_at: { type: [string, "null"], format: date-time }
        decision_reason: { type: [string, "null"] }
        published_by_principal_id: { type: [string, "null"], format: uuid }
        published_at: { type: [string, "null"], format: date-time }
        updated_at: { type: [string, "null"], format: date-time }
      additionalProperties: false
    EditorialPostSummaryData:
      type: object
      required:
        - id
        - slug
        - translation_group_id
        - content_type
        - domain_slug
        - language_code
        - status
        - published_version_id
        - latest_revision_id
        - latest_revision_number
        - latest_revision_status
        - latest_title
        - updated_at
      properties:
        id: { type: string, format: uuid }
        slug: { type: string }
        translation_group_id: { type: string, format: uuid }
        content_type: { $ref: "#/components/schemas/EditorialContentType" }
        domain_slug:
          oneOf:
            - $ref: "#/components/schemas/DomainSlug"
            - type: "null"
        language_code: { $ref: "#/components/schemas/LanguageCode" }
        status: { $ref: "#/components/schemas/EditorialStatus" }
        published_version_id: { type: [string, "null"], format: uuid }
        latest_revision_id: { type: string, format: uuid }
        latest_revision_number: { type: integer, minimum: 1 }
        latest_revision_status: { $ref: "#/components/schemas/EditorialStatus" }
        latest_title: { type: string }
        updated_at: { type: string, format: date-time }
      additionalProperties: false
    EditorialRevisionDetailData:
      type: object
      required:
        - revision
        - slug
        - domain_slug
        - language_code
        - translation_group_id
        - title
        - summary
        - body_markdown
        - structured_content
        - seo_title
        - seo_description
        - canonical_url
        - hero_image_url
        - hero_image_alt
        - include_in_rag
        - author
        - sources
      properties:
        revision: { $ref: "#/components/schemas/EditorialRevisionData" }
        slug: { type: string }
        domain_slug:
          oneOf:
            - $ref: "#/components/schemas/DomainSlug"
            - type: "null"
        language_code: { $ref: "#/components/schemas/LanguageCode" }
        translation_group_id: { type: string, format: uuid }
        title: { type: string }
        summary: { type: string }
        body_markdown: { type: string }
        structured_content:
          type: object
          additionalProperties: true
        seo_title: { type: [string, "null"] }
        seo_description: { type: [string, "null"] }
        canonical_url: { type: [string, "null"] }
        hero_image_url: { type: [string, "null"] }
        hero_image_alt: { type: [string, "null"] }
        include_in_rag: { type: boolean }
        author: { $ref: "#/components/schemas/EditorialAuthorData" }
        sources:
          type: array
          items: { $ref: "#/components/schemas/EditorialSourceReference" }
      additionalProperties: false
    ReviewedKnowledgeSourceData:
      type: object
      required:
        - source_id
        - document_id
        - document_version_id
        - document_slug
        - document_title
        - document_summary
        - domain_slug
        - language_code
        - version_label
        - source_title
        - organization
        - source_url
        - source_locator
        - reviewed_at
        - published_at
        - effective_until
      properties:
        source_id: { type: string, format: uuid }
        document_id: { type: string, format: uuid }
        document_version_id: { type: string, format: uuid }
        document_slug: { type: string }
        document_title: { type: string }
        document_summary: { type: string }
        domain_slug: { $ref: "#/components/schemas/DomainSlug" }
        language_code: { $ref: "#/components/schemas/LanguageCode" }
        version_label: { type: string }
        source_title: { type: string }
        organization: { type: string }
        source_url: { type: string, format: uri }
        source_locator: { type: string }
        reviewed_at: { type: string, format: date-time }
        published_at: { type: string, format: date-time }
        effective_until: { type: [string, "null"], format: date }
      additionalProperties: false
    PublishedAuthorData:
      type: object
      required: [slug, name, bio, avatar_url, profile_url]
      properties:
        slug: { type: string }
        name: { type: string }
        bio: { type: [string, "null"] }
        avatar_url: { type: [string, "null"] }
        profile_url: { type: [string, "null"] }
      additionalProperties: false
    PublishedSourceData:
      type: object
      required:
        [
          source_id,
          document_version_id,
          document_slug,
          document_title,
          reviewed_at,
          title,
          organization,
          url,
          locator,
        ]
      properties:
        source_id: { type: string, format: uuid }
        document_version_id: { type: [string, "null"], format: uuid }
        document_slug: { type: [string, "null"] }
        document_title: { type: [string, "null"] }
        reviewed_at: { type: [string, "null"], format: date-time }
        title: { type: string }
        organization: { type: string }
        url: { type: string, format: uri }
        locator: { type: string }
      additionalProperties: false
    PublishedTranslationData:
      type: object
      required: [language_code, slug, title]
      properties:
        language_code: { $ref: "#/components/schemas/LanguageCode" }
        slug: { type: string }
        title: { type: string }
      additionalProperties: false
    PublishedPostSummaryData:
      type: object
      required:
        - id
        - slug
        - translation_group_id
        - content_type
        - domain_slug
        - language_code
        - title
        - summary
        - hero_image_url
        - hero_image_alt
        - author_name
        - author_slug
        - published_at
        - updated_at
      properties:
        id: { type: string, format: uuid }
        slug: { type: string }
        translation_group_id: { type: string, format: uuid }
        content_type: { $ref: "#/components/schemas/EditorialContentType" }
        domain_slug:
          oneOf:
            - $ref: "#/components/schemas/DomainSlug"
            - type: "null"
        language_code: { $ref: "#/components/schemas/LanguageCode" }
        title: { type: string }
        summary: { type: string }
        hero_image_url: { type: [string, "null"] }
        hero_image_alt: { type: [string, "null"] }
        author_name: { type: string }
        author_slug: { type: string }
        published_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
      additionalProperties: false
    PublishedPostData:
      type: object
      required:
        - id
        - version_id
        - version_number
        - slug
        - content_type
        - domain_slug
        - language_code
        - title
        - summary
        - body_markdown
        - structured_content
        - seo_title
        - seo_description
