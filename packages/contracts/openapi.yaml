        message: { type: string }
        details: { type: object }
      additionalProperties: false
    ErrorResponse:
      type: object
      required: [error, meta]
      properties:
        error: { $ref: "#/components/schemas/ErrorDetail" }
        meta: { $ref: "#/components/schemas/ResponseMeta" }
      additionalProperties: false
