    IndexJobResult:
      type: object
      required:
        - index_job_id
        - document_id
        - document_version_id
        - idempotency_key
        - model_key
        - status
        - attempt_count
        - max_attempts
        - scheduled_at
      properties:
        index_job_id: { type: string, format: uuid }
        document_id: { type: string, format: uuid }
        document_version_id: { type: string, format: uuid }
        idempotency_key: { type: string }
        model_key: { type: string }
        status:
          type: string
          enum: [queued, running, retry_scheduled, succeeded, dead_lettered, cancelled]
        attempt_count: { type: integer, minimum: 0 }
        max_attempts: { type: integer, minimum: 1 }
        scheduled_at: { type: string, format: date-time }
      additionalProperties: false
    IndexJobResponse:
      type: object
      required: [data, meta]
      properties:
        data: { $ref: "#/components/schemas/IndexJobResult" }
        meta: { $ref: "#/components/schemas/ResponseMeta" }
      additionalProperties: false
    ErrorDetail:
