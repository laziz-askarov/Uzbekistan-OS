name: uzbekistan-os

services:
  postgres:
    image: pgvector/pgvector:0.8.5-pg17-bookworm
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-uzbekistan_os}
      POSTGRES_USER: ${POSTGRES_USER:-uzbekistan_os}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-development-only}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-uzbekistan_os} -d ${POSTGRES_DB:-uzbekistan_os}",
        ]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:8.8.1-alpine3.23
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-uzbekistan-os}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-local-development-only}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    command: ["python", "-m", "alembic", "-c", "alembic.ini", "upgrade", "head"]
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-uzbekistan_os}:${POSTGRES_PASSWORD:-local-development-only}@postgres:5432/${POSTGRES_DB:-uzbekistan_os}
    depends_on:
      postgres:
        condition: service_healthy

  object-store-init:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    command: ["python", "-m", "app.worker", "ensure-object-store"]
    env_file:
      - path: .env
        required: false
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-uzbekistan-os}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-local-development-only}
      S3_BUCKET: ${S3_BUCKET:-uzbekistan-os-ingestion}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_AUTO_CREATE_BUCKET: ${S3_AUTO_CREATE_BUCKET:-true}
    depends_on:
      minio:
        condition: service_started

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-uzbekistan_os}:${POSTGRES_PASSWORD:-local-development-only}@postgres:5432/${POSTGRES_DB:-uzbekistan_os}
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-uzbekistan-os}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-local-development-only}
      S3_BUCKET: ${S3_BUCKET:-uzbekistan-os-ingestion}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_AUTO_CREATE_BUCKET: ${S3_AUTO_CREATE_BUCKET:-true}
      API_CORS_ORIGINS: ${API_CORS_ORIGINS:-http://localhost:3000}
    ports:
      - "8000:8000"
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/ready', timeout=3)",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      minio:
        condition: service_started
      object-store-init:
        condition: service_completed_successfully

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-uzbekistan_os}:${POSTGRES_PASSWORD:-local-development-only}@postgres:5432/${POSTGRES_DB:-uzbekistan_os}
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-uzbekistan-os}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-local-development-only}
      S3_BUCKET: ${S3_BUCKET:-uzbekistan-os-ingestion}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_AUTO_CREATE_BUCKET: ${S3_AUTO_CREATE_BUCKET:-true}
      WORKER_REGISTRY_PATH: data/sources/registry.development.json
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      registry-sync:
        condition: service_completed_successfully
      api:
        condition: service_healthy

  registry-sync:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    command: ["python", "-m", "app.worker", "sync-registry"]
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-uzbekistan_os}:${POSTGRES_PASSWORD:-local-development-only}@postgres:5432/${POSTGRES_DB:-uzbekistan_os}
      WORKER_REGISTRY_PATH: data/sources/registry.development.json
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  scheduler:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    command: ["python", "-m", "app.worker", "schedule"]
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-uzbekistan_os}:${POSTGRES_PASSWORD:-local-development-only}@postgres:5432/${POSTGRES_DB:-uzbekistan_os}
      REDIS_URL: redis://redis:6379/0
      WORKER_REGISTRY_PATH: data/sources/registry.development.json
      WORKER_SCHEDULER_POLL_SECONDS: ${WORKER_SCHEDULER_POLL_SECONDS:-60}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      registry-sync:
        condition: service_completed_successfully

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000/api/v1}
    ports:
      - "3000:3000"
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres-data:
  redis-data:
  minio-data:
